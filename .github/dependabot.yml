version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    # Only propose versions that have been public for a week, so hijacked
    # releases are usually pulled before they reach this repository.
    cooldown:
      default-days: 7
    # Major versions (Rails, RSpec, ...) are upgraded by hand with the upgrade guide.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rails:
        patterns: ["rails", "action*", "active*", "railties"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major versions are upgraded by hand: TypeScript has to stay within what
    # typescript-eslint supports, and React / Storybook majors need code changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
