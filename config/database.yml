# MySQL 8.0 (Aurora MySQL 3 compatible). Local dev uses `docker compose up -d`.
# Solid Queue tables live in the primary database (see docs/adr/0003-cache-and-queue.md),
# so there is a single database per environment.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_0900_ai_ci
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 3307 } %>

development:
  <<: *default
  database: care_finder_development

test:
  <<: *default
  database: care_finder_test<%= ENV["TEST_ENV_NUMBER"] %>

# Production credentials come from the ECS task definition (Secrets Manager).
production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "care_finder" } %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>
  ssl_mode: <%= ENV.fetch("DB_SSL_MODE") { "required" } %>
